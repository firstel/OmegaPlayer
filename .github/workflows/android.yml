name: Android verification
on:
  push:
    branches: [feature/sd-card-folder-browser]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37'
      - name: Unit tests, debug APK, and lint
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
